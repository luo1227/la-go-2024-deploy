name: 公网测试服

# 本仓库只保存 workflow 和脚本，不含服务端二进制或游戏数据。
# 服务端和管理平台从私有仓的 GitHub Release 下载（用 PRIVATE_REPO_TOKEN secret），
# 运行时状态也写回私有仓的 test-state 分支。

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: '会话时长（分钟，1-350）'
        required: false
        default: '350'
      gm_token:
        description: 'GM 管理口令；留空则自动生成随机口令'
        required: false
        default: ''
      enable_ssh:
        description: '开启 tmate SSH 调试会话'
        type: boolean
        default: false
      bore_server:
        description: 'bore 中继服务器'
        required: false
        default: 'bore.pub'

permissions:
  contents: read

concurrency:
  group: public-test-server
  cancel-in-progress: false

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      BORE_VERSION: v0.6.0
      BORE_SHA256: e484d1e3acba77169b773f31a5bfb34192d4b660f44a094a658a2522cd2270f7
    steps:
      - name: 校验配置
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_REPO_TOKEN:-}" ]; then
            echo "缺少 PRIVATE_REPO_TOKEN secret。需要一把能读取私有仓 release 的 PAT（fine-grained: 该仓 Contents=Read；classic: repo）。"
            exit 1
          fi
          dur='${{ inputs.duration_minutes }}'
          case "$dur" in (*[!0-9]*|'') echo "duration_minutes 必须是整数"; exit 1;; esac
          if [ "$dur" -lt 1 ] || [ "$dur" -gt 350 ]; then
            echo "duration_minutes 必须在 1-350 之间"; exit 1
          fi
          echo "DURATION_MINUTES=$dur" >> "$GITHUB_ENV"

      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 从私有仓 release 下载服务端与静态资源
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: ${{ vars.PRIVATE_REPO || 'luo1227/la-go-2024' }}
          RELEASE_TAG: ${{ vars.RELEASE_TAG || 'deploy-latest' }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${PRIVATE_REPO}/releases/tags/${RELEASE_TAG}"
          curl -fsSL -H "Authorization: Bearer ${PRIVATE_REPO_TOKEN}" \
               -H "Accept: application/vnd.github+json" "$api" -o "$RUNNER_TEMP/release.json"
          mkdir -p "$RUNNER_TEMP/dl"
          py="import json,sys;d=json.load(open(sys.argv[1]));print(next((a[\"url\"] for a in d.get(\"assets\",[]) if a[\"name\"]==sys.argv[2]),\"\"))"
          for asset in la-server admin-web.tar.gz SHA256SUMS; do
            url="$(python3 -c "$py" "$RUNNER_TEMP/release.json" "$asset")"
            if [ -z "$url" ]; then echo "release 缺少资产 $asset"; exit 1; fi
            curl -fsSL -H "Authorization: Bearer ${PRIVATE_REPO_TOKEN}" -H "Accept: application/octet-stream" "$url" -o "$RUNNER_TEMP/dl/$asset"
          done
          ( cd "$RUNNER_TEMP/dl" && sha256sum -c SHA256SUMS )
          mkdir -p server web/admin
          cp "$RUNNER_TEMP/dl/la-server" server/la-server
          tar -xzf "$RUNNER_TEMP/dl/admin-web.tar.gz" -C web/admin
          chmod +x server/la-server
          test -f web/admin/index.html
          echo "已从 ${PRIVATE_REPO}@${RELEASE_TAG} 取得服务端与静态资源"

      - name: 准备运行时目录
        run: |
          set -euo pipefail
          mkdir -p state
          echo "STATE_DIR=$GITHUB_WORKSPACE/state" >> "$GITHUB_ENV"

      - name: 恢复存档（私有仓 test-state 分支）
        continue-on-error: true
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: ${{ vars.PRIVATE_REPO || 'luo1227/la-go-2024' }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/${PRIVATE_REPO}.git"
          if git ls-remote --exit-code --heads "$REMOTE" test-state >/dev/null 2>&1; then
            git clone --depth 1 --branch test-state "$REMOTE" "$RUNNER_TEMP/la-restore"
            echo "=== 已从 test-state 分支恢复 ==="
            for f in "$RUNNER_TEMP/la-restore"/*.json "$RUNNER_TEMP/la-restore"/endpoint.txt; do
              [ -f "$f" ] && cp -f "$f" state/ || true
            done
            if [ -d "$RUNNER_TEMP/la-restore/defect-images" ]; then
              mkdir -p state/defect-images
              cp -f "$RUNNER_TEMP/la-restore/defect-images"/* state/defect-images/ 2>/dev/null || true
            fi
            ls -la state || true
          else
            echo "test-state 分支不存在，首次运行使用空白存档"
          fi

      - name: 生成 GM 口令
        run: |
          set -euo pipefail
          token='${{ inputs.gm_token }}'
          if [ -z "$token" ]; then
            token="$(openssl rand -hex 16)"
            echo "未填写 gm_token，已自动生成随机口令"
          fi
          echo "::add-mask::$token"
          echo "LA_GM_TOKEN=$token" >> "$GITHUB_ENV"
          echo "GM_TOKEN_USED=$token" >> "$GITHUB_ENV"
          printf '%s\n' "$token" > state/gm-token.txt

      - name: 启动服务端
        env:
          LA_STATE_DIR: ${{ github.workspace }}/state
          LA_DEFECT_IMAGE_DIR: ${{ github.workspace }}/state/defect-images
          LA_ADMIN_WEB_DIR: ${{ github.workspace }}/web/admin
          LA_GO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          nohup ./server/la-server --listen 127.0.0.1:18080 > "$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=${SERVER_PID}" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then
              echo "服务端已就绪:"; curl -fsS http://127.0.0.1:18080/health; echo; exit 0
            fi
            sleep 1
          done
          echo "服务端启动失败，日志："; cat "$RUNNER_TEMP/server.log"; exit 1

      - name: 下载并启动 bore 隧道
        env:
          BORE_SERVER: ${{ inputs.bore_server }}
        run: |
          set -euo pipefail
          url="https://github.com/ekzhang/bore/releases/download/${BORE_VERSION}/bore-${BORE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/bore.tar.gz"
          echo "${BORE_SHA256}  $RUNNER_TEMP/bore.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/bore.tar.gz" -C "$RUNNER_TEMP"
          BORE_BIN="$RUNNER_TEMP/bore"
          [ -x "$BORE_BIN" ] || BORE_BIN="$(find "$RUNNER_TEMP" -maxdepth 2 -type f -name bore | head -n1)"
          [ -n "$BORE_BIN" ] || { echo "未找到 bore 可执行文件"; exit 1; }
          chmod +x "$BORE_BIN"
          RUST_LOG=info nohup "$BORE_BIN" local 18080 --local-host 127.0.0.1 --to "$BORE_SERVER" > "$RUNNER_TEMP/bore.log" 2>&1 &
          BORE_PID=$!
          echo "BORE_PID=${BORE_PID}" >> "$GITHUB_ENV"
          port=""
          for i in $(seq 1 60); do
            port="$(grep -oE 'listening at [^ ]+:[0-9]+' "$RUNNER_TEMP/bore.log" 2>/dev/null | head -n1 | grep -oE '[0-9]+$' || true)"
            [ -n "$port" ] && break
            kill -0 "${BORE_PID}" 2>/dev/null || break
            sleep 1
          done
          if [ -z "$port" ]; then
            echo "bore 隧道未建立，日志："; cat "$RUNNER_TEMP/bore.log"; exit 1
          fi
          echo "LA_PUBLIC_ENDPOINT=http://${BORE_SERVER}:${port}" >> "$GITHUB_ENV"
          echo "LA_PUBLIC_PORT=$port" >> "$GITHUB_ENV"
          printf 'http://%s:%s\n' "$BORE_SERVER" "$port" > state/endpoint.txt
          echo "隧道地址: http://${BORE_SERVER}:${port}"

      - name: 输出连接信息
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: ${{ vars.PRIVATE_REPO || 'luo1227/la-go-2024' }}
        run: |
          set -euo pipefail
          # 先把 endpoint 和 GM 口令推到私有仓，再从那里取口令；公开日志里不出现口令。
          bash scripts/persist-state.sh || echo "同步连接信息到私有仓失败"
          {
            echo "## 公网测试服已启动"
            echo ""
            echo "- 服务端地址（客户端填这个）: ${LA_PUBLIC_ENDPOINT}"
            echo "- 管理平台: ${LA_PUBLIC_ENDPOINT}/gm/"
            echo "- GM 口令: 见私有仓 ${PRIVATE_REPO} 的 test-state 分支 gm-token.txt"
            echo "- 时长: ${DURATION_MINUTES} 分钟，随后自动结束并保存存档"
            echo ""
            echo "> 客户端启动器里把「服务端地址」改为上面的地址即可。"
            echo "> GM 口令不写入公开日志；管理平台需要 ?token=，值在私有仓。"
            echo "> /api/platform/* 无鉴权，地址泄露等于别人可注册账号、改区服，只用于测试。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 开启 SSH 调试会话
        if: ${{ inputs.enable_ssh }}
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true

      - name: 保活并定期存档
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + DURATION_MINUTES * 60 ))
          next_persist=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "服务端进程已退出，日志："; cat "$RUNNER_TEMP/server.log"; exit 1
            fi
            if ! kill -0 "$BORE_PID" 2>/dev/null; then
              echo "bore 进程已退出，日志："; cat "$RUNNER_TEMP/bore.log"; exit 1
            fi
            if [ "$(date +%s)" -ge "$next_persist" ]; then
              bash scripts/persist-state.sh || echo "定期存档失败，继续运行"
              next_persist=$(( $(date +%s) + 600 ))
            fi
            sleep 20
          done
          echo "达到会话时长，准备结束"

      - name: 结束存档
        if: always()
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: ${{ vars.PRIVATE_REPO || 'luo1227/la-go-2024' }}
        run: |
          set -euo pipefail
          bash scripts/persist-state.sh || echo "结束存档失败"
          if [ -n "${SERVER_PID:-}" ]; then kill "$SERVER_PID" 2>/dev/null || true; fi
          if [ -n "${BORE_PID:-}" ]; then kill "$BORE_PID" 2>/dev/null || true; fi
